<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老司機 即刻聽寫</title>
<style>
  :root { --navy:#1F3A5F; --red:#8B1E2D; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:#1d2530; }
  header { background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .brand { font-size:34px; font-weight:700; letter-spacing:1px; }
  .badge { white-space:nowrap; display:inline-block; vertical-align:middle; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:3px 12px; font-size:14px; margin-left:10px; }
  .ctrl { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
  .lang { display:flex; border:2px solid var(--navy); border-radius:999px; overflow:hidden; background:#fff; }
  .lang button { background:transparent; color:var(--navy); border:0; padding:12px 20px; font-size:17px; cursor:pointer; }
  .lang button.on { background:var(--navy); color:#fff; font-weight:700; }
  main { max-width:1200px; margin:0 auto; padding:28px 18px 40px; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px; align-items:start; }
  .content { min-width:0; }
  @media (max-width:600px) { #editor { min-height:130px !important; } #interim { min-height:20px !important; } .card { padding-top:12px !important; padding-bottom:12px !important; } .brand { font-size:28px; } .badge { font-size:12px; margin-left:6px; } }
  @media (max-width:900px) { main { grid-template-columns:1fr; } .promo { position:static !important; } .social { flex-direction:row !important; } }
  .hero { text-align:center; margin:10px 0 24px; }
  .hero h1 { font-size:30px; color:var(--navy); margin:0 0 8px; }
  .desc { font-size:16px; color:#556; margin:0 0 20px; }
  .promo { display:block; margin:0; position:sticky; top:20px; text-decoration:none; background:var(--navy); color:#fff; border-radius:14px; padding:18px 22px; text-align:center; box-shadow:0 4px 14px rgba(31,58,95,.25); }
  .promo .t1 { font-size:14px; opacity:.85; }
  .promo .t2 { font-size:20px; font-weight:700; margin:4px 0; }
  .promo .t3 { display:inline-block; margin-top:10px; background:var(--red); color:#fff; text-decoration:none; padding:9px 22px; border-radius:999px; font-size:16px; }
  .social { display:flex; flex-direction:column; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .social a { color:#fff; text-decoration:none; padding:8px 16px; border-radius:10px; font-size:15px; border:1px solid rgba(255,255,255,.35); }
  .social .fb { background:#1877F2; } .social .yt { background:#FF0000; } .social .tk { background:#111; }
  .promo a:hover { filter:brightness(1.12); }
  .hdr-link { color:#fff; font-size:14px; text-decoration:underline; margin-right:14px; }
  .right { display:flex; align-items:center; }
  #toggle { background:var(--red); color:#fff; border:0; border-radius:999px; padding:20px 52px; font-size:24px; font-weight:700; font-family:inherit; line-height:1.25; cursor:pointer; box-shadow:0 6px 18px rgba(139,30,45,.35); }
  #toggle.live { background:#444; }
  .beside { display:flex; align-items:center; gap:8px; }
  @media (max-width:600px) { #toggle { width:100%; padding:20px 16px; font-size:24px; } }
  #status { margin-top:12px; font-size:14px; color:#667; min-height:20px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#d33; margin-right:6px; animation:blink 1s infinite; vertical-align:middle; }
  @keyframes blink { 50% { opacity:.2; } }
  .card { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); padding:18px 20px; }
  .label { font-size:13px; color:#889; margin-bottom:8px; }
  #editor { min-height:300px; outline:none; font-size:19px; line-height:1.8; white-space:pre-wrap; word-break:break-word; }
  #editor p { margin:0 0 10px; }
  #editor:empty:before { content:attr(data-ph); color:#aab; }
  #interim { color:#8a94a6; font-size:19px; line-height:1.8; min-height:30px; border-top:1px dashed #e3e6ea; margin-top:10px; padding-top:8px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .actions button { background:#fff; border:1px solid var(--navy); color:var(--navy); border-radius:10px; padding:10px 20px; font-size:16px; cursor:pointer; }
  .actions button.danger { border-color:var(--red); color:var(--red); }
  .actions button.primary { background:#8B1E2D; border-color:#8B1E2D; color:#fff; font-weight:600; }
  .actions button.ai { background:#fff; border:1px solid #c5ccd4; color:#6b7a85; }
  .actions button.ai:disabled { opacity:.6; }
  #uploadBtn { background:#fff; color:#6b7a85; border:1px solid #c5ccd4; border-radius:8px; padding:3px 10px; font-size:13px; font-weight:400; font-family:inherit; line-height:1.4; cursor:pointer; -webkit-appearance:none; appearance:none; }
  #uploadBtn:disabled { opacity:.55; cursor:default; }
  #uploadBtn:focus-visible { outline:2px solid #c5ccd4; outline-offset:2px; }
  #uploadStatus { width:100%; max-width:36em; text-align:center; font-size:18px; line-height:1.55; font-weight:700; color:var(--navy); white-space:pre-line; overflow-wrap:anywhere; }
  #uploadStatus:empty { display:none; }
  #uploadStatus.err { color:var(--red); }
  .warn a.btn, .warn button { display:inline-block; margin:8px 6px 0 0; padding:8px 14px; border-radius:8px; border:0; background:#8B1E2D; color:#fff; font-size:15px; text-decoration:none; cursor:pointer; }
  .warn { line-height:1.6; background:#fff4e5; border:1px solid #f0c27a; color:#7a4b00; padding:10px 14px; border-radius:10px; margin-bottom:16px; display:none; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:8px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .3s; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div><span class="brand">老司機 即刻聽寫</span><span class="badge">中文＋English</span></div>
  <div class="right"><a class="hdr-link" href="https://shinhung.com.tw" target="_blank" rel="noopener">泌尿外科 侯鎮邦醫師</a>
  </div>
</header>
<main>
 <div class="content">
  <div class="warn" id="inapp"></div>
  <div class="warn" id="warn">這個瀏覽器不支援即時語音辨識，請改用電腦或手機上的 Chrome、Edge，或 iPhone 的 Safari。</div>
  <section class="hero">
    <h1>說話，文字立即出現。</h1>
    <p class="desc">按下按鈕開始說話，文字即時出現，可修改、複製或下載。</p>
    <div class="ctrl">
      <button id="toggle">開始即時聽寫</button>
      <div class="beside">
        <div class="lang" role="group" aria-label="語言">
          <button data-lang="zh-TW">中文</button>
          <button data-lang="en-US">English</button>
        </div>
        <button type="button" id="uploadBtn">upload files</button>
      </div>
    </div>
    <div id="status"></div>
    <div id="uploadStatus" role="status" aria-live="polite"></div>
    <input id="uploadFile" type="file" accept="audio/*,.mp3,.m4a,.mp4,.wav,.webm,.ogg,.oga,.opus,.flac,.mpeg,.mpga,video/mp4,video/webm" hidden aria-hidden="true" tabindex="-1">
  </section>
  <section class="card">
    <div class="label">聽寫內容（可直接點進去修改）</div>
    <div id="editor" contenteditable="true" data-ph="按下「開始即時聽寫」後開始說話，文字會接在游標位置；點文章中間可插入，按 Enter 換行。"></div>
    <div id="interim"></div>
  </section>
  <div class="actions">
    <button id="copy" class="primary">複製全文</button>
    <button id="download">下載 .txt</button>
    <button id="clear" class="danger">清除內容</button>
    <button id="aiundo" style="display:none">↶ 復原</button>
    <button id="aifix" class="ai" style="display:none">AI 校正</button>
  </div>
  </div>
  <aside class="promo">
    <div class="t1">本工具由以下醫師免費提供</div>
    <div class="t2">泌尿外科 侯鎮邦醫師</div>
    <div class="t1">攝護腺微創治療・機器手臂手術</div>
    <a class="t3" href="https://shinhung.com.tw" target="_blank" rel="noopener">前往侯鎮邦醫師官方網站 →</a>
    <div class="social">
      <a class="fb" href="https://www.facebook.com/NewUroTech/" target="_blank" rel="noopener">侯醫師 Facebook 粉絲專頁</a>
      <a class="yt" href="https://www.youtube.com/@Dr_Hou_NewUroTech" target="_blank" rel="noopener">侯醫師 YouTube 頻道</a>
      <a class="tk" href="https://www.tiktok.com/@chen_pang_hou" target="_blank" rel="noopener">侯醫師 抖音 TikTok</a>
    </div>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = s => document.querySelector(s);
  const editor=$('#editor'), interimEl=$('#interim'), toggle=$('#toggle'), statusEl=$('#status');
  let lang = localStorage.getItem('lsj-lang') || 'zh-TW';
  let rec=null, listening=false;

  function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1600); }
  function paintLang(){ document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang)); }
  function setStatus(){ statusEl.innerHTML = listening ? '<span class="dot"></span>聆聽中（'+(lang==='zh-TW'?'中文':'English')+'）' : ''; }

  function punctuate(text){
    text = text.trim();
    if(!text) return '';
    if(lang==='zh-TW'){
      text = text.replace(/\s+/g,'');
      if(!/[。！？…，、；：」』）.!?]$/.test(text)){
        text += /(嗎|呢|吧|麼|是不是|有沒有|對不對)$/.test(text) ? '？' : '。';
      }
    } else {
      text = text.charAt(0).toUpperCase()+text.slice(1);
      if(!/[.!?…,;:]$/.test(text)){
        text += /^(what|why|how|when|where|who|which|is|are|do|does|did|can|could|will|would|should|may)\b/i.test(text) ? '?' : '.';
      }
    }
    return text;
  }
  let savedRange=null;
  document.addEventListener('selectionchange',()=>{ const sel=getSelection(); if(sel.rangeCount && editor.contains(sel.getRangeAt(0).startContainer)) savedRange=sel.getRangeAt(0).cloneRange(); });
  function addParagraph(text){
    let r=savedRange;
    if(!r || !editor.contains(r.startContainer)){ r=document.createRange(); r.selectNodeContents(editor); r.collapse(false); }
    r.deleteContents();
    // English: add a space if the previous character is not a space
    if(lang!=='zh-TW'){ const pre=document.createRange(); pre.setStart(editor,0); pre.setEnd(r.startContainer,r.startOffset); const before=pre.toString(); if(before && !/\s$/.test(before)) text=' '+text; }
    { const post=document.createRange(); post.setStart(r.endContainer,r.endOffset); post.setEnd(editor,editor.childNodes.length); const after=post.toString();
      if(after && !/^\s*\n/.test(after)) text=text.replace(/[。？.?]$/,''); }
    const node=document.createTextNode(text); r.insertNode(node);
    const mark=document.createElement('span'); node.after(mark); mark.scrollIntoView({block:'nearest'}); mark.remove();
    const nr=document.createRange(); nr.setStartAfter(node); nr.collapse(true); savedRange=nr.cloneRange();
    if(document.activeElement===editor){ const sel=getSelection(); sel.removeAllRanges(); sel.addRange(nr); }
    return node;
  }

  let lastRaw='', lastAt=0, lastNode=null, lastText='';
  const norm=x=>x.replace(/[\s，。？！、,.?!]/g,'');
  function build(){
    const r = new SR();
    // Android Chrome repeats results in continuous mode: use one-utterance mode + auto restart
    r.lang = lang; r.continuous = !isAndroid; r.interimResults = true;
    const done=new Set();
    r.onstart = () => done.clear();
    r.onresult = e => {
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){
          if(done.has(i)) continue; done.add(i);
          let raw=res[0].transcript.trim(); const n=norm(raw);
          if(!n) continue;
          const recent=Date.now()-lastAt<8000;
          if(recent && n===lastRaw) continue;
          if(recent && lastRaw && n.startsWith(lastRaw)){
            if(lastNode && lastNode.isConnected && lastNode.textContent===lastText){ // replace the earlier piece with the longer one
              const sp=lastText.startsWith(' ')?' ':''; lastNode.textContent=sp+punctuate(raw); lastText=lastNode.textContent; lastRaw=n; lastAt=Date.now(); continue; }
            let k=0, m=0; while(k<raw.length && m<lastRaw.length){ if(norm(raw[k])) m++; k++; }
            raw=raw.slice(k).trim(); }
          lastRaw=n; lastAt=Date.now();
          const t=punctuate(raw); if(t){ lastNode=addParagraph(t); lastText=lastNode?lastNode.textContent:''; } }
        else interim += res[0].transcript;
      }
      interimEl.textContent = interim;
    };
    r.onerror = e => {
      if(e.error==='not-allowed' || e.error==='service-not-allowed'){ stop(); showMicHelp(); }
    };
    r.onend = () => { interimEl.textContent=''; if(listening){ try{ r.start(); }catch(_){ } } };
    return r;
  }
  function start(){
    if(!SR) return;
    rec = build(); listening=true;
    try{ rec.start(); }catch(_){}
    toggle.textContent='停止聽寫'; toggle.classList.add('live'); setStatus();
  }
  function stop(){
    listening=false;
    if(rec){ rec.onend=null; try{ rec.stop(); }catch(_){} rec=null; }
    interimEl.textContent='';
    toggle.textContent='開始即時聽寫'; toggle.classList.remove('live'); setStatus();
  }
  function switchLang(l){
    if(l===lang) return;
    lang=l; localStorage.setItem('lsj-lang', lang); paintLang();
    if(listening){
      const old=rec; listening=false;
      if(old){ old.onend=null; try{ old.stop(); }catch(_){} }
      setTimeout(start, 250);
      toast('已切換為'+(lang==='zh-TW'?'中文':'English')+'，下一段用新語言辨識');
    } else setStatus();
  }

  document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>switchLang(b.dataset.lang)));
  toggle.addEventListener('click',()=> listening?stop():start());
  function fullText(){ return editor.innerText.replace(/\n{3,}/g,'\n\n').trim(); }
  $('#copy').addEventListener('click',async()=>{ const t=fullText(); if(!t) return toast('目前沒有內容');
    try{ await navigator.clipboard.writeText(t); }catch(_){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast('已複製全文'); });
  $('#download').addEventListener('click',()=>{ const t=fullText(); if(!t) return toast('目前沒有內容');
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    const name='聽寫_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.txt';
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/plain;charset=utf-8'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); });
  $('#clear').addEventListener('click',()=>{ if(!editor.textContent.trim()) return; if(confirm('確定要清除全部內容嗎？')){ editor.innerHTML=''; savedRange=null; interimEl.textContent=''; toast('已清除'); } });

  paintLang();

  /* in-app browser / mic help */
  const UA=navigator.userAgent||'';
  const isLine=/Line\//i.test(UA), isFB=/FBAN|FBAV|FB_IAB|Instagram|MicroMessenger/i.test(UA);
  const isAndroid=/Android/i.test(UA), isIOS=/iPhone|iPad|iPod/i.test(UA);
  if(isLine && !/openExternalBrowser=1/.test(location.search)){
    location.replace(location.origin+location.pathname+'?openExternalBrowser=1'); }
  function inappHTML(lead){
    const url=location.origin+location.pathname;
    let h='<b>'+lead+'</b><br>';
    h+= isIOS ? '請點右上角「⋯」或分享鍵，選「在 Safari 中開啟」。' : '請點右上角「⋮」或「⋯」，選「在瀏覽器中開啟」，或改用 Chrome 開啟。';
    if(isAndroid) h+='<br><a class="btn" href="intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end">用 Chrome 開啟</a>';
    h+='<button type="button" id="copyurl">複製網址</button>';
    return h; }
  function bindCopy(){ const b=document.getElementById('copyurl'); if(b) b.onclick=async()=>{ try{ await navigator.clipboard.writeText(location.origin+location.pathname); toast('網址已複製，請貼到 Chrome 或 Safari'); }catch(_){ prompt('請複製這個網址',location.origin+location.pathname); } }; }
  if(isLine||isFB){ const b=$('#inapp'); b.innerHTML=inappHTML('您正在 LINE／臉書等 App 裡開啟，這裡通常無法使用麥克風。'); b.style.display='block'; bindCopy(); }
  function showMicHelp(){
    const b=$('#inapp');
    if(isLine||isFB){ b.innerHTML=inappHTML('這個 App 不允許網頁使用麥克風。'); }
    else { b.innerHTML='<b>麥克風被封鎖了。</b><br>請點網址列左邊的 🔒 或「ⓘ」圖示 →「權限」→ 把「麥克風」改成「允許」，再重新整理頁面。'+(isIOS?'<br>iPhone：設定 → Safari → 麥克風 → 允許。':''); }
    b.style.display='block'; bindCopy(); b.scrollIntoView({behavior:'smooth',block:'center'}); }

  /* private AI proofreading + audio upload share one password.
     Asked each time with prompt(); not stored (drop any old copy). */
  const AI_URL='https://papaya-line-boat.onrender.com/fix';
  const TRANSCRIBE_URL=AI_URL.replace(/\/fix$/,'/transcribe');
  function askPassword(){ return prompt('請輸入 AI 校正密碼'); }
  const aiBtn=$('#aifix'), undoBtn=$('#aiundo'); let undoHTML=null;
  localStorage.removeItem('lsj-ai-pw'); aiBtn.style.display='';
  aiBtn.addEventListener('click',async()=>{
    const t=fullText(); if(!t) return toast('目前沒有內容');
    const pw=askPassword(); if(!pw) return;
    aiBtn.disabled=true; aiBtn.textContent='校正中…（第一次約需 30 秒）';
    try{
      const res=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,lang,password:pw})});
      if(res.status===401||res.status===403){ throw new Error(res.status===401?'密碼錯誤':'AI 校正尚未啟用'); }
      if(!res.ok) throw new Error('校正失敗（'+res.status+'）');
      const j=await res.json(); if(!j.text) throw new Error('沒有收到結果');
      undoHTML=editor.innerHTML; editor.innerText=j.text; savedRange=null; lastNode=null;
      undoBtn.style.display=''; toast('已完成 AI 校正');
    }catch(e){ toast(e.message||'校正失敗，請稍後再試'); }
    finally{ aiBtn.disabled=false; aiBtn.textContent='AI 校正'; }
  });
  undoBtn.addEventListener('click',()=>{ if(undoHTML!==null){ editor.innerHTML=undoHTML; undoHTML=null; savedRange=null; lastNode=null; undoBtn.style.display='none'; toast('已復原'); } });

  /* upload a recording; same password value /fix sends, as a form field */
  const uploadBtn=$('#uploadBtn'), uploadStatus=$('#uploadStatus'), uploadInput=$('#uploadFile');
  const MAX_AUDIO=100*1024*1024;
  const AUDIO_EXT={flac:1,mp3:1,mp4:1,mpeg:1,mpga:1,m4a:1,ogg:1,oga:1,opus:1,wav:1,webm:1};
  const COLD_MSG='伺服器可能正在醒來（免費方案第一次會比較慢）。請稍等約半分鐘後再試一次。';
  const NET_MSG='網路連不上，請檢查連線後再試一次。';
  const TRANSCRIBE_MSG='轉文字中，請稍候（長錄音可能要一兩分鐘）';
  let uploadBusy=false;
  function setUploadStatus(msg,isErr){
    uploadStatus.textContent=msg||'';
    uploadStatus.classList.toggle('err',!!isErr);
  }
  function audioExt(name){ const m=/\.([A-Za-z0-9]+)$/.exec(name||''); return m?m[1].toLowerCase():''; }
  function audioAllowed(file){
    const ext=audioExt(file.name);
    if(ext) return !!AUDIO_EXT[ext];
    const mime=(file.type||'').split(';')[0].trim().toLowerCase();
    return mime.indexOf('audio/')===0||mime==='video/mp4'||mime==='video/webm'||mime==='video/ogg'||mime==='application/ogg';
  }
  function uploadName(file){
    if(AUDIO_EXT[audioExt(file.name)]) return file.name;
    const mime=(file.type||'').split(';')[0].trim().toLowerCase();
    const byMime={'audio/mpeg':'mp3','audio/mp3':'mp3','audio/mp4':'m4a','audio/m4a':'m4a','audio/x-m4a':'m4a','audio/wav':'wav','audio/x-wav':'wav','audio/wave':'wav','audio/webm':'webm','video/webm':'webm','audio/ogg':'ogg','application/ogg':'ogg','video/ogg':'ogg','audio/flac':'flac','audio/x-flac':'flac','video/mp4':'mp4','audio/mpga':'mpga'};
    return (file.name||'audio')+(byMime[mime]?'.'+byMime[mime]:'.webm');
  }
  function transcribeLang(){ return lang==='zh-TW'?'zh':'en'; }
  uploadBtn.addEventListener('click',()=>{ if(!uploadBusy) uploadInput.click(); });
  uploadInput.addEventListener('change',()=>{
    const file=uploadInput.files&&uploadInput.files[0];
    uploadInput.value='';
    if(!file||uploadBusy) return;
    if(!file.size){ setUploadStatus('這個錄音檔是空的，請換一個檔案。',true); return; }
    if(file.size>MAX_AUDIO){ setUploadStatus('檔案太大，請壓到 100 MB 以內再上傳（最長約 60 分鐘）。',true); return; }
    if(!audioAllowed(file)){ setUploadStatus('不支援這個格式，請改用 mp3、m4a、wav、webm、ogg 或 flac。',true); return; }
    const pw=askPassword(); if(!pw) return;
    sendAudio(file,pw);
  });
  function sendAudio(file,pw){
    uploadBusy=true; uploadBtn.disabled=true; uploadBtn.textContent='請稍候…'; uploadBtn.setAttribute('aria-busy','true');
    setUploadStatus('上傳中…',false);
    const started=Date.now(); let settled=false, phase='upload';
    const slowTimer=setTimeout(()=>{
      if(!settled&&phase==='transcribe') setUploadStatus(TRANSCRIBE_MSG+'\n第一次使用若比較久，是伺服器正在醒來，請再等一下。',false);
    },20000);
    function finish(){
      if(settled) return; settled=true; clearTimeout(slowTimer);
      uploadBusy=false; uploadBtn.disabled=false; uploadBtn.textContent='upload files'; uploadBtn.removeAttribute('aria-busy');
    }
    function showTranscribe(){ if(settled) return; phase='transcribe'; setUploadStatus(TRANSCRIBE_MSG,false); }
    const xhr=new XMLHttpRequest();
    xhr.open('POST',TRANSCRIBE_URL);
    xhr.timeout=150000;
    xhr.upload.onprogress=e=>{
      if(settled||!e.lengthComputable||!(e.total>0)) return;
      if(e.loaded>=e.total) showTranscribe();
      else setUploadStatus('上傳中…（'+Math.max(1,Math.round(e.loaded/e.total*100))+'%）',false);
    };
    xhr.upload.onload=showTranscribe;
    function failNet(){
      if(settled) return;
      const slow=Date.now()-started>12000;
      finish(); setUploadStatus(slow?COLD_MSG:NET_MSG,true); toast(slow?'請稍後再試':'網路連不上');
    }
    xhr.onerror=xhr.onabort=failNet;
    xhr.ontimeout=()=>{ if(settled) return; finish(); setUploadStatus(COLD_MSG,true); toast('請稍後再試'); };
    xhr.onload=()=>{ if(settled) return; const elapsed=Date.now()-started; finish(); handleTranscribe(xhr.status,xhr.responseText,elapsed); };
    const fd=new FormData();
    fd.append('file',file,uploadName(file));
    fd.append('lang',transcribeLang());
    fd.append('password',pw);
    xhr.send(fd);
  }
  function handleTranscribe(status,raw,elapsed){
    let j=null; try{ j=JSON.parse(raw); }catch(_){}
    if(status===401||status===403){
      const msg=status===401?'密碼錯誤':'AI 校正尚未啟用';
      setUploadStatus(status===401?'密碼錯誤，請再按一次按鈕重新輸入。':msg,true);
      toast(msg); return;
    }
    const serverMsg=j&&typeof j.error==='string'&&j.error&&j.error!=='unauthorized'&&j.error!=='disabled'?j.error:'';
    if(serverMsg){ setUploadStatus(serverMsg,true); toast(serverMsg.length<=18?serverMsg:'轉文字沒有完成'); return; }
    if(status===200&&j&&j.ok===true&&typeof j.text==='string'&&j.text.trim()){
      addParagraph(j.text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim());
      setUploadStatus('已轉成文字，可以再按「AI 校正」。',false); toast('已轉成文字'); return;
    }
    if(status===502||status===504||elapsed>20000){ setUploadStatus(COLD_MSG,true); toast('請稍後再試'); return; }
    setUploadStatus('伺服器沒有完成轉文字，請稍後再試一次。',true); toast('轉文字失敗');
  }
  if(!SR){ $('#warn').style.display='block'; toggle.disabled=true; toggle.style.opacity=.5; }
})();
</script>
